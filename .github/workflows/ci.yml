name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libopenxr-dev

      - name: Set OpenVR SDK path
        shell: bash
        run: |
          echo "OPENVR_SDK_DIR=${GITHUB_WORKSPACE}/.openvr-sdk" >> "$GITHUB_ENV"

      - name: Fetch OpenVR SDK
        shell: bash
        run: |
          git clone --depth=1 https://github.com/ValveSoftware/openvr.git "$OPENVR_SDK_DIR"

      - run: npm ci
      - run: npm run build
      - run: npm run rebuild:electron

      - name: Verify Windows OpenXR API-layer artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assets = @(
            "packages/native-addon/build/Release/electron_vr_openxr_layer.dll",
            "packages/native-addon/build/Release/electron_vr_openxr_layer_cli.exe",
            "packages/native-addon/build/Release/electron_vr_openxr_layer_test.exe",
            "packages/native-addon/build/Release/electron_vr_openxr_layer.json",
            "packages/native-addon/build/Release/protocol.json"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing $asset" }
          }

          & "packages/native-addon/build/Release/electron_vr_openxr_layer_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "OpenXR API-layer native harness failed" }

          $cli = "packages/native-addon/build/Release/electron_vr_openxr_layer_cli.exe"
          function Invoke-LayerCli([string] $command) {
            $output = & $cli $command | Out-String
            if ($LASTEXITCODE -ne 0) { throw "API-layer CLI command failed: $command" }
            return $output
          }

          try {
            Invoke-LayerCli "uninstall" | Out-Null
            Invoke-LayerCli "install" | Out-Null
            $enabled = Invoke-LayerCli "status"
            if ($enabled -notmatch "installed=true" -or $enabled -notmatch "enabled=true") {
              throw "API layer was not installed and enabled`n$enabled"
            }

            Invoke-LayerCli "disable" | Out-Null
            $disabled = Invoke-LayerCli "status"
            if ($disabled -notmatch "enabled=false") {
              throw "API layer did not disable`n$disabled"
            }

            Invoke-LayerCli "enable" | Out-Null
            $reenabled = Invoke-LayerCli "status"
            if ($reenabled -notmatch "enabled=true") {
              throw "API layer did not re-enable`n$reenabled"
            }
          } finally {
            Invoke-LayerCli "uninstall" | Out-Null
          }
      - run: npm run test:unit

      - name: Run runtime info smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:runtime-info

      - name: Run runtime info smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:runtime-info

  smoke:
    name: Electron Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libopenxr-dev libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1 libatk-bridge2.0-0 libxrandr2

      - name: Set OpenVR SDK path
        shell: bash
        run: |
          echo "OPENVR_SDK_DIR=${GITHUB_WORKSPACE}/.openvr-sdk" >> "$GITHUB_ENV"

      - name: Fetch OpenVR SDK
        shell: bash
        run: |
          git clone --depth=1 https://github.com/ValveSoftware/openvr.git "$OPENVR_SDK_DIR"

      - run: npm ci
      - run: npm run build
      - run: npm run rebuild:electron

      - name: Run runtime info smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:runtime-info

      - name: Run runtime info smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:runtime-info

      - name: Run Electron smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:smoke

      - name: Run Electron smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:smoke

  e2e:
    name: E2E Demo App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libx11-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libopenxr-dev libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1 libatk-bridge2.0-0 libxrandr2

      - name: Set OpenVR SDK path
        shell: bash
        run: |
          echo "OPENVR_SDK_DIR=${GITHUB_WORKSPACE}/.openvr-sdk" >> "$GITHUB_ENV"

      - name: Fetch OpenVR SDK
        shell: bash
        run: |
          git clone --depth=1 https://github.com/ValveSoftware/openvr.git "$OPENVR_SDK_DIR"

      - run: npm ci
      - run: npm run build
      - run: npm run rebuild:electron

      - name: Run demo e2e test
        run: xvfb-run -a npm run test:e2e

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore
